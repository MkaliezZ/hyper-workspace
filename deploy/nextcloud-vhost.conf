<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog ${APACHE_LOG_DIR}/error.log
    # Device authorization URLs contain one-shot secrets. No URL, query,
    # referrer, cookie, header, body or client-supplied text enters access logs.
    CustomLog ${APACHE_LOG_DIR}/access.log "hyper_source status=%>s duration_us=%D"
</VirtualHost>
