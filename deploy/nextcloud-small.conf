<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    # A browser can occupy six connections while fetching the cold login assets.
    # Keep slots for the device-flow poll and health check under slow downloads.
    ServerLimit 8
    MaxRequestWorkers 8
    MaxConnectionsPerChild 300
</IfModule>
